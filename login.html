<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sydney Automation Co. — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }
    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 14px;
    }
    .logo-title {
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .logo-sub {
      color: #475569;
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
      font-family: 'DM Mono', monospace;
    }
    label {
      display: block;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    input[type="password"].error {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248,113,113,0.15);
    }
    .error-msg {
      color: #f87171;
      font-size: 12px;
      font-weight: 600;
      min-height: 20px;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 20px;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .footer-note {
      color: #334155;
      font-size: 11px;
      text-align: center;
      margin-top: 20px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-area">
      <div class="logo-icon">⚡</div>
      <div class="logo-title">Sydney Automation Co.</div>
      <div class="logo-sub">Job Management System</div>
    </div>

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter') login()"
      autofocus
    >
    <div class="error-msg" id="error-msg"></div>

    <button class="btn" id="login-btn" onclick="login()">
      <div class="spinner" id="spinner"></div>
      <span id="btn-text">Unlock System</span>
    </button>

    <div class="footer-note">Authorised access only &mdash; Sydney Automation Co.</div>
  </div>

  <script>
    async function login() {
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');
      const input = document.getElementById('password');

      if (!password) {
        errorEl.textContent = 'Please enter your password.';
        input.classList.add('error');
        setTimeout(() => { input.classList.remove('error'); errorEl.textContent = ''; }, 2000);
        return;
      }

      // Show loading state
      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = 'Checking…';
      errorEl.textContent = '';
      input.classList.remove('error');

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (res.ok) {
          btnText.textContent = '✓ Access granted';
          spinner.style.display = 'none';
          // Redirect to the page they were trying to reach, or home
          const params = new URLSearchParams(window.location.search);
          const dest = params.get('from') || '/';
          setTimeout(() => { window.location.href = dest; }, 300);
        } else {
          throw new Error('Incorrect');
        }
      } catch (e) {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Unlock System';
        errorEl.textContent = 'Incorrect password. Try again.';
        input.value = '';
        input.classList.add('error');
        input.focus();
        setTimeout(() => { input.classList.remove('error'); errorEl.textContent = ''; }, 3000);
      }
    }
  </script>
</body>
</html>
